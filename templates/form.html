{% extends 'base.html' %}
{% block content %}
<div class="page-heading">
  <div>
    <h1>{{ title|default:'Edit account' }}</h1>
    <p>Review the details before saving.</p>
  </div>
</div>
<form method="post" class="card form-card">
  {% csrf_token %}
  {{ form.as_div }}
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-primary">Save changes</button>
    <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const type = document.getElementById("id_account_type");
  if (!type) return;
  const fixedIds = ["fixed_principal", "fixed_start_date", "fixed_maturity_date", "fixed_annual_rate_percent", "fixed_interest_method", "fixed_compounding_frequency", "fixed_interest_payment_method", "fixed_interest_destination", "fixed_interest_destination_account", "fixed_early_withdrawal_allowed", "fixed_early_withdrawal_penalty_notes", "fixed_maturity_instruction", "fixed_maturity_destination_account", "funding_account"];
  const savingsIds = ["savings_annual_interest_rate_percent"];
  const taxIds = ["return_tax_treatment"];
  const refresh = () => {
    fixedIds.forEach(name => {
      const field = document.getElementById(`id_${name}`);
      if (field) field.closest("div").hidden = type.value !== "FIXED_TERM";
    });
    savingsIds.forEach(name => {
      const field = document.getElementById(`id_${name}`);
      if (field) field.closest("div").hidden = type.value !== "SAVINGS";
    });
    taxIds.forEach(name => {
      const field = document.getElementById(`id_${name}`);
      if (field) field.closest("div").hidden = !["SAVINGS", "FIXED_TERM"].includes(type.value);
    });
  };
  type.addEventListener("change", refresh);
  refresh();
});
</script>
{% endblock %}
