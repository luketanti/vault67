name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-security-check-key-please-do-not-use-in-production-2026
      DJANGO_ALLOWED_HOSTS: example.invalid
      POSTGRES_DB: vault67
      POSTGRES_USER: vault67
      POSTGRES_PASSWORD: ci-only-security-check-password
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: ruff check .
      - run: bandit -q -r accounts config core dashboard investments ledger tax -x "*/migrations/*"
      - run: pip-audit -r requirements-dev.txt
      - run: pytest
      - run: DJANGO_SETTINGS_MODULE=config.settings.production python manage.py check --deploy
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
